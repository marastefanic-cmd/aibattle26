services:
  - type: web
    name: barcamp-orders
    env: node
    plan: free
    buildCommand: echo "no build step - zero dependency app"
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
