  <!-- shine + eye veins -->
  <circle cx="70" cy="100" r="4" fill="#fff"/>
  <circle cx="185" cy="127" r="5" fill="#fff"/>
  <path d="M56 132 l10 -4 M60 142 l9 -8 M146 92 l10 6 M200 92 l-8 8" stroke="#ff5a5a" stroke-width="2.5" stroke-linecap="round"/>
