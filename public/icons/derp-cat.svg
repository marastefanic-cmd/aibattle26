    <circle cx="86" cy="118" r="38" fill="#fff"/>
    <circle cx="172" cy="114" r="44" fill="#fff"/>
    <circle cx="74" cy="104" r="12" fill="#1a1a1a"/>
    <circle cx="190" cy="132" r="15" fill="#1a1a1a"/>
